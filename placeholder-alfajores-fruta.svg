<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-fruta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2819"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
    <radialGradient id="glow-fruta" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#D4A94F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A94F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glazed-cookie" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F4EAD6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E8CB82" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2A1B12" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Fondo madera oscura -->
  <rect width="600" height="400" fill="url(#bg-fruta)"/>
  <ellipse cx="300" cy="180" rx="230" ry="150" fill="url(#glow-fruta)"/>

  <!-- Textura de madera -->
  <line x1="0" y1="80" x2="600" y2="83" stroke="#2A1B12" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="165" x2="600" y2="162" stroke="#2A1B12" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="250" x2="600" y2="253" stroke="#2A1B12" stroke-width="0.4" opacity="0.35"/>
  <line x1="0" y1="330" x2="600" y2="328" stroke="#2A1B12" stroke-width="0.3" opacity="0.25"/>

  <!-- Alfajor de fruta izquierdo -->
  <ellipse cx="190" cy="190" rx="60" ry="54" fill="url(#glazed-cookie)" stroke="#D4A94F" stroke-width="1" opacity="0.75"/>
  <!-- Capa de dulce de membrillo rojizo vino -->
  <ellipse cx="190" cy="198" rx="54" ry="7" fill="#6B1E2B" opacity="0.6"/>
  <!-- Glasé real blanco/oro -->
  <path d="M145 180 Q190 160 235 180 Q215 172 190 174 Q165 172 145 180Z" fill="#F4EAD6" opacity="0.4"/>

  <!-- Alfajor de fruta central (protagonista) -->
  <ellipse cx="310" cy="175" rx="74" ry="66" fill="url(#glazed-cookie)" stroke="#D4A94F" stroke-width="1.3" opacity="0.85"/>
  <!-- Capa de dulce de membrillo visible -->
  <ellipse cx="310" cy="186" rx="66" ry="9" fill="#8A2A3A" opacity="0.7"/>
  <!-- Glasé superior azucarado -->
  <path d="M255 160 Q310 138 365 160 Q340 150 310 152 Q280 150 255 160Z" fill="#F4EAD6" opacity="0.5"/>
  <ellipse cx="310" cy="165" rx="50" ry="25" fill="#E8CB82" opacity="0.08"/>

  <!-- Alfajor derecho -->
  <ellipse cx="430" cy="195" rx="58" ry="52" fill="url(#glazed-cookie)" stroke="#D4A94F" stroke-width="1" opacity="0.7"/>
  <ellipse cx="430" cy="203" rx="52" ry="6.5" fill="#6B1E2B" opacity="0.55"/>
  <path d="M385 186 Q430 168 475 186 Q455 178 430 180 Q405 178 385 186Z" fill="#F4EAD6" opacity="0.35"/>

  <!-- Filete inferior -->
  <line x1="130" y1="345" x2="470" y2="345" stroke="#D4A94F" stroke-width="0.5" opacity="0.3"/>
  <circle cx="300" cy="345" r="2.5" fill="#D4A94F" opacity="0.3"/>
</svg>
